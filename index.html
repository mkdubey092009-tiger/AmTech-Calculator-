<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AmTech Calculator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root {
      --bg: #f8fafd;
      --surface: #ffffff;
      --surface-variant: #eef3fc;
      --primary: #0b57d0;
      --on-primary: #ffffff;
      --secondary-container: #c2e7ff;
      --on-secondary-container: #001d35;
      --tertiary-container: #d3e3fd;
      --on-tertiary-container: #041e49;
      --text: #1f1f1f;
      --text-muted: #5f6368;
      --danger: #b3261e;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    body.dark {
      --bg: #111318;
      --surface: #1b1e26;
      --surface-variant: #252a34;
      --primary: #a8c7fa;
      --on-primary: #062e6f;
      --secondary-container: #004a77;
      --on-secondary-container: #c2e7ff;
      --tertiary-container: #0842a0;
      --on-tertiary-container: #d3e3fd;
      --text: #e3e2e6;
      --text-muted: #9aa0a6;
      --danger: #f2b8b5;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      transition: background 0.25s, color 0.25s;
    }

    .app {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 860px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .app {
        height: 92dvh;
        border-radius: 32px;
        box-shadow: var(--shadow);
      }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 12px;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--primary);
    }

    .icon-btns {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-variant);
      color: var(--text);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .display {
      flex: 1;
      background: var(--surface-variant);
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .expression {
      width: 100%;
      text-align: right;
      font-size: 2.2rem;
      font-weight: 500;
      word-break: break-all;
      max-height: 55%;
      overflow-y: auto;
      line-height: 1.2;
    }

    .preview {
      font-size: 1.4rem;
      color: var(--text-muted);
      margin-top: 8px;
      min-height: 1.8rem;
      cursor: pointer;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .key {
      aspect-ratio: 1.15 / 1;
      border: none;
      border-radius: 26px;
      font-size: 1.5rem;
      font-weight: 500;
      background: var(--surface-variant);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.08s, filter 0.15s;
      user-select: none;
    }

    .key:active {
      transform: scale(0.93);
      filter: brightness(0.92);
    }

    .key.op {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-size: 1.65rem;
    }

    .key.fn {
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
    }

    .key.clear {
      color: var(--danger);
      font-weight: 600;
    }

    .key.equals {
      background: var(--primary);
      color: var(--on-primary);
      font-size: 1.8rem;
    }

    /* History Drawer */
    .history-drawer {
      position: absolute;
      inset: 0;
      background: var(--surface);
      padding: 20px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.28s ease;
      z-index: 10;
    }

    .history-drawer.open {
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--surface-variant);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      padding: 12px;
      border-radius: 16px;
      background: var(--surface-variant);
      text-align: right;
      cursor: pointer;
    }

    .history-expr {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .history-res {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--primary);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <span class="app-title">AmTech Calculator</span>
      <div class="icon-btns">
        <button class="icon-btn" id="historyBtn" title="History">🕒</button>
        <button class="icon-btn" id="themeBtn" title="Toggle Theme">🌓</button>
      </div>
    </div>

    <div class="display">
      <div class="expression" id="expression">0</div>
      <div class="preview" id="preview" title="Tap to copy"></div>
    </div>

    <div class="keypad">
      <button class="key fn clear" data-action="clear">AC</button>
      <button class="key fn" data-action="paren">( )</button>
      <button class="key fn" data-val="%">%</button>
      <button class="key op" data-val="÷">÷</button>

      <button class="key" data-val="7">7</button>
      <button class="key" data-val="8">8</button>
      <button class="key" data-val="9">9</button>
      <button class="key op" data-val="×">×</button>

      <button class="key" data-val="4">4</button>
      <button class="key" data-val="5">5</button>
      <button class="key" data-val="6">6</button>
      <button class="key op" data-val="−">−</button>

      <button class="key" data-val="1">1</button>
      <button class="key" data-val="2">2</button>
      <button class="key" data-val="3">3</button>
      <button class="key op" data-val="+">+</button>

      <button class="key" data-val="0">0</button>
      <button class="key" data-val=".">.</button>
      <button class="key" data-action="back">⌫</button>
      <button class="key equals" data-action="equals">=</button>
    </div>

    <div class="history-drawer" id="historyDrawer">
      <div class="history-header">
        <h3>History</h3>
        <div class="icon-btns">
          <button class="icon-btn" id="clearHistoryBtn" title="Clear History">🗑️</button>
          <button class="icon-btn" id="closeHistoryBtn" title="Close">✕</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const exprEl = document.getElementById('expression');
    const prevEl = document.getElementById('preview');
    const historyDrawer = document.getElementById('historyDrawer');
    const historyList = document.getElementById('historyList');
    let expr = '';
    let history = JSON.parse(localStorage.getItem('amtech_calc_history') || '[]');

    function sanitizeAndEval(raw) {
      if (!raw) return '';
      let clean = raw
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

      const openCount = (clean.match(/\(/g) || []).length;
      const closeCount = (clean.match(/\)/g) || []).length;
      if (openCount > closeCount) {
        clean += ')'.repeat(openCount - closeCount);
      }

      clean = clean.replace(/[+\-*/.]+$/, '');
      if (!clean || !/^[0-9+\-*/().\s]+$/.test(clean)) return '';

      try {
        const res = Function('"use strict"; return (' + clean + ')')();
        if (!isFinite(res)) return 'Cannot divide by 0';
        return Number(res.toPrecision(12)).toString();
      } catch {
        return '';
      }
    }

    function updateUI() {
      exprEl.textContent = expr || '0';
      const live = sanitizeAndEval(expr);
      prevEl.textContent = live && live !== expr ? live : '';
    }

    function appendValue(val) {
      const ops = ['+', '−', '×', '÷'];
      const last = expr.slice(-1);

      if (val === '.') {
        const parts = expr.split(/[+\-−×÷()%]/);
        if (parts[parts.length - 1].includes('.')) return;
        if (!last || ops.includes(last) || last === '(') expr += '0';
      }

      if (ops.includes(val)) {
        if (!expr && val !== '−') return;
        if (ops.includes(last)) {
          expr = expr.slice(0, -1) + val;
          updateUI();
          return;
        }
      }

      expr += val;
      updateUI();
    }

    function handleParen() {
      const openCount = (expr.match(/\(/g) || []).length;
      const closeCount = (expr.match(/\)/g) || []).length;
      const last = expr.slice(-1);

      if (openCount > closeCount && /[\d)]/.test(last)) {
        expr += ')';
      } else {
        if (/[\d)]/.test(last)) expr += '×';
        expr += '(';
      }
      updateUI();
    }

    function calculate() {
      const res = sanitizeAndEval(expr);
      if (!res) return;
      if (res === 'Cannot divide by 0') {
        prevEl.textContent = res;
        return;
      }
      history.unshift({ expr, res });
      history = history.slice(0, 50);
      localStorage.setItem('amtech_calc_history', JSON.stringify(history));
      expr = res;
      updateUI();
      prevEl.textContent = '';
    }

    document.querySelectorAll('.key').forEach((btn) => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;
        const action = btn.dataset.action;
        if (val) appendValue(val);
        else if (action === 'clear') { expr = ''; updateUI(); }
        else if (action === 'back') { expr = expr.slice(0, -1); updateUI(); }
        else if (action === 'paren') handleParen();
        else if (action === 'equals') calculate();
      });
    });

    prevEl.addEventListener('click', () => {
      if (prevEl.textContent && prevEl.textContent !== 'Cannot divide by 0') {
        navigator.clipboard?.writeText(prevEl.textContent);
        const old = prevEl.textContent;
        prevEl.textContent = 'Copied!';
        setTimeout(() => (prevEl.textContent = old), 800);
      }
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('amtech_calc_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    if (localStorage.getItem('amtech_calc_theme') === 'dark') {
      document.body.classList.add('dark');
    }

    function renderHistory() {
      historyList.innerHTML = history.length
        ? history.map((item) => `
            <div class="history-item" data-res="${item.res}">
              <div class="history-expr">${item.expr}</div>
              <div class="history-res">= ${item.res}</div>
            </div>`).join('')
        : '<p style="color:var(--text-muted);text-align:center;margin-top:24px;">No calculations yet</p>';

      historyList.querySelectorAll('.history-item').forEach((el) => {
        el.addEventListener('click', () => {
          expr = el.dataset.res;
          updateUI();
          historyDrawer.classList.remove('open');
        });
      });
    }

    document.getElementById('historyBtn').addEventListener('click', () => {
      renderHistory();
      historyDrawer.classList.add('open');
    });
    document.getElementById('closeHistoryBtn').addEventListener('click', () => historyDrawer.classList.remove('open'));
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      history = [];
      localStorage.removeItem('amtech_calc_history');
      renderHistory();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/AmTech-Calculator-/sw.js');
    }
  </script>
</body>
</html>
